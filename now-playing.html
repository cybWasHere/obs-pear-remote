<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Now Playing</title>
<!-- Now Playing: an OBS browser source card for Pear Desktop (YouTube Music).
     Browser source URL http://127.0.0.1:9870/now-playing.html, 800x300, transparent.
     Reads Pear's Plugins > Amuse endpoint (read-only, no auth). Hides itself when nothing plays.
     Options: ?amuse=http://127.0.0.1:9863/query (default tries 127.0.0.1 then localhost),
     &theme=purple|mono -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --panel: rgba(18, 7, 34, 0.72);
    --edge: rgba(201, 160, 255, 0.35);
    --lavender: #c9a0ff;
    --purple: #6b2eb3;
    --text: #f1e8ff;
    --muted: #b49ad6;
  }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { padding: 60px; font-family: "Syne", "Segoe UI", sans-serif; }

  .card {
    display: flex; align-items: center; gap: 22px;
    width: 640px; padding: 18px 26px 18px 18px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: 18px;
    box-shadow: 0 0 40px rgba(107, 46, 179, 0.45), inset 0 0 30px rgba(107, 46, 179, 0.25);
    opacity: 0; transform: translateX(-40px);
    transition: opacity .6s ease, transform .6s cubic-bezier(.2, .9, .3, 1.2);
  }
  .card.show { opacity: 1; transform: none; }
  .card.paused { opacity: .45; }

  .cover {
    position: relative; flex: none; width: 112px; height: 112px; border-radius: 12px;
    background: linear-gradient(135deg, var(--purple), #1d0b36) center / cover;
    box-shadow: 0 0 0 1px var(--edge), 0 8px 24px rgba(0, 0, 0, .5);
    transition: background-image .4s;
  }

  .meta { min-width: 0; flex: 1; display: grid; gap: 6px; }
  .label {
    display: flex; align-items: center; gap: 10px;
    font: 500 13px/1 "JetBrains Mono", monospace; letter-spacing: .18em;
    text-transform: uppercase; color: var(--lavender);
  }
  .eq { display: inline-flex; align-items: flex-end; gap: 3px; height: 14px; }
  .eq i { width: 3px; background: var(--lavender); border-radius: 2px; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.3s; }
  .eq i:nth-child(3) { animation-delay: -.6s; }
  .eq i:nth-child(4) { animation-delay: -.15s; }
  .paused .eq i { animation-play-state: paused; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 14px; } }

  .clip { overflow: hidden; white-space: nowrap; }
  .scroll { display: inline-block; padding-right: 60px; }
  .clip.long .scroll { animation: marquee var(--dur, 12s) linear infinite; }
  @keyframes marquee { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--shift)); } }

  .title { font-weight: 800; font-size: 34px; line-height: 1.15; color: var(--text); text-shadow: 0 0 18px rgba(201, 160, 255, .35); }
  .artist { font-weight: 700; font-size: 22px; line-height: 1.2; color: var(--muted); }

  .swap { animation: swap .5s ease; }
  @keyframes swap { from { opacity: 0; filter: blur(6px); transform: translateY(8px); } to { opacity: 1; filter: none; transform: none; } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="cover" id="cover"></div>
    <div class="meta">
      <div class="label"><span class="eq"><i></i><i></i><i></i><i></i></span>Now playing</div>
      <div class="clip" id="titleClip"><span class="scroll title" id="title"></span></div>
      <div class="clip" id="artistClip"><span class="scroll artist" id="artist"></span></div>
    </div>
  </div>
<script>
const P = new URLSearchParams(location.search);
const API = P.get("amuse") ? [P.get("amuse")] : ["http://127.0.0.1:9863/query", "http://localhost:9863/query"];
const $ = id => document.getElementById(id);
let lastId = null;
let lastErr = null, reported = null;

function fit(clip) {
  const inner = clip.firstElementChild;
  clip.classList.remove("long");
  const over = inner.scrollWidth - clip.clientWidth;
  if (over > 4) {
    clip.style.setProperty("--shift", `-${inner.scrollWidth - clip.clientWidth + 20}px`);
    clip.style.setProperty("--dur", `${Math.max(8, over / 25)}s`);
    clip.classList.add("long");
  }
}

async function query() {
  for (const url of API) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (r.ok) return await r.json();
    } catch (e) { lastErr = `${url}: ${e}`; }
  }
  if (lastErr !== reported) { console.error(`[now-playing] Pear API unreachable: ${lastErr}`); reported = lastErr; }
  return null;
}

async function tick() {
  const d = await query();
  const card = $("card");
  const t = d && d.player && d.player.hasSong && d.track && !d.track.isAdvertisement ? d.track : null;
  if (!t) { card.classList.remove("show"); return; }

  if (t.id !== lastId) {
    lastId = t.id;
    $("title").textContent = t.title || "";
    $("artist").textContent = t.author || "";
    $("cover").style.backgroundImage = t.cover ? `url("${t.cover}")` : "";
    for (const id of ["title", "artist"]) {
      const el = $(id); el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap");
    }
    requestAnimationFrame(() => { fit($("titleClip")); fit($("artistClip")); });
  }
  card.classList.toggle("paused", !!d.player.isPaused);
  card.classList.add("show");
  if (reported !== "ok") { console.log(`[now-playing] showing: ${t.title}`); reported = "ok"; }
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
